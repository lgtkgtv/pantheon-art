            title: "The Metamorphosis of Narcissus",
            year: "1937",
            museum: "Tate Modern, London",
            res: "2427 × 1596 px",
            mp: "3.87 MP",
            size: "0.65 MB",
            file: "./artist_paintings/Top_Celebrity_Masterpieces/70_Salvador_Dali_-_The_Metamorphosis_of_Narcissus.jpg"
          }
        ]
      },
      {
        id: "kahlo",
        epochTag: "modernism",
        name: "Frida Kahlo",
        lifespan: "1907–1954",
        epithet: "The Global Cultural & Feminist Icon of Autobiographical Surrealism",
        whyBelongs: "Has surpassed nearly all contemporaries in 21st-century iconography ('Fridamania'), fashion, gender theory, and auction records. Transformed chronic pain and defiance into visual poetry.",
        evolutionRole: "Pioneered raw autobiographical surrealism rooted in Mexicanidad folk art; shattered taboos surrounding the female body, trauma, and vulnerability, declaring: 'I painted my own reality.'",
        paintings: [
          {
            title: "The Two Fridas",
            year: "1939",
            museum: "Museo de Arte Moderno, Mexico City",
            res: "2206 × 2186 px",
            mp: "4.82 MP",
            size: "1.73 MB",
            file: "./artist_paintings/Top_Celebrity_Masterpieces/75_Frida_Kahlo_-_The_Two_Fridas.jpg"
          },
          {
            title: "The Broken Column",
            year: "1944",
            museum: "Museo Dolores Olmedo, Mexico City",
            res: "1693 × 2229 px",
            mp: "3.77 MP",
            size: "1.12 MB",
            file: "./artist_paintings/Top_Celebrity_Masterpieces/76_Frida_Kahlo_-_The_Broken_Column.jpg"
          },
          {
            title: "Viva la Vida, Watermelons",
            year: "1954",
            museum: "Frida Kahlo Museum, Mexico City",
            res: "2429 × 1789 px",
            mp: "4.35 MP",
            size: "1.43 MB",
            file: "./artist_paintings/Top_Celebrity_Masterpieces/77_Frida_Kahlo_-_Viva_la_Vida,_Watermelons.jpg"
          }
        ]
      }
    ];

    const container = document.getElementById("mastersList");

    function renderMasters(list) {
      container.innerHTML = "";
      list.forEach((m, idx) => {
        const section = document.createElement("section");
        section.className = "master-card bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl transition hover:border-slate-700 space-y-6";
        section.dataset.epoch = m.epochTag;

        let paintingsHtml = m.paintings.map(p => `
          <div class="group relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800 hover:border-amber-500/50 transition duration-200 flex flex-col">
            <div class="relative aspect-[4/3] bg-black/50 overflow-hidden cursor-pointer flex items-center justify-center" onclick="openModal('${p.file}', '${p.title} (${p.year})', '${m.name} • ${p.museum} • ${p.res} (${p.mp})')">
              <img src="${p.file}" alt="${p.title}" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-300" loading="lazy" />
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                <span class="text-xs font-bold text-amber-300 flex items-center gap-1">🔍 Click to inspect ultra-res</span>
              </div>
              <div class="absolute top-2 right-2">
                <span class="bg-black/80 backdrop-blur text-[11px] font-mono font-bold text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30">${p.mp}</span>
              </div>
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between">
              <div>
                <h4 class="font-bold text-sm text-slate-100 group-hover:text-amber-300 transition">${p.title}</h4>
                <p class="text-xs text-slate-400 mt-0.5">${p.year} &bull; <span class="text-slate-300">${p.museum}</span></p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400 font-mono">
                <span>${p.res}</span>
                <a href="${p.file}" target="_blank" class="text-amber-400 hover:underline font-sans font-medium">Open Image &rarr;</a>
              </div>
            </div>
          </div>
        `).join("");

        section.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-baseline justify-between pb-4 border-b border-slate-800 gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-mono font-bold text-amber-400/80">#${String(idx + 1).padStart(2, '0')}</span>
                <h2 class="text-xl sm:text-2xl font-serif-title font-bold text-white tracking-wide">${m.name}</h2>
                <span class="text-xs text-slate-400 font-mono">(${m.lifespan})</span>
              </div>
              <p class="text-xs sm:text-sm font-medium text-amber-300/90 mt-1 italic">${m.epithet}</p>
            </div>
            <span class="text-xs font-mono px-2.5 py-1 rounded bg-slate-800 text-slate-300 uppercase tracking-wider">${m.epochTag}</span>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 text-xs sm:text-sm text-slate-300 leading-relaxed">
            <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 space-y-1.5">
              <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider font-mono">Why They Belong</h3>
              <p>${m.whyBelongs}</p>
            </div>
            <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 space-y-1.5">
              <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider font-mono">Role in the Evolution of Art</h3>
              <p>${m.evolutionRole}</p>
            </div>
          </div>

          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider font-mono">Landmark Masterpieces (Full Museum Scans)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
              ${paintingsHtml}
            </div>
          </div>
        `;
        container.appendChild(section);
      });
    }

    function filterEpoch(epoch) {
      document.querySelectorAll(".epoch-btn").forEach(b => {
        b.className = "epoch-btn px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition";
      });
      event.target.className = "epoch-btn px-3.5 py-1.5 rounded-lg text-xs font-medium bg-amber-500 text-slate-950 font-bold transition";

      if (epoch === "all") {
        renderMasters(masters);
      } else {
        const filtered = masters.filter(m => m.epochTag === epoch);
        renderMasters(filtered);
      }
    }

    function openModal(imgSrc, title, meta) {
      document.getElementById("modalImg").src = imgSrc;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMeta").textContent = meta;
      document.getElementById("modalDirectLink").href = imgSrc;
      document.getElementById("imageModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("imageModal").classList.add("hidden");
    }

    // Initial render
    renderMasters(masters);
  </script>
</body>
</html>
